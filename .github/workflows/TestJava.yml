name: Java CI with Ant

on:
  push:
    branches: [ "main", "master", "KhanbanTasks" ]
  pull_request:
    branches: [ "main", "master", "KhanbanTasks" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Download JUnit and Hamcrest
      run: |
        mkdir -p lib
        curl -L -o lib/junit-4.13.2.jar https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
        curl -L -o lib/hamcrest-core-1.3.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar

    - name: Run Unit Tests with Ant
      run: ant test -Djavac.source=21 -Djavac.target=21 -Djavac.classpath=lib/junit-4.13.2.jar:lib/hamcrest-core-1.3.jar
